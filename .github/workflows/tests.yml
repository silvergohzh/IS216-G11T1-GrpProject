# Runs all our tests on GitHub's computers. Owner: M6
# It runs on every pull request and every push to main, and shows a green tick or a red cross on GitHub.
# That way we find out a change broke something BEFORE it is merged.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Get our code
      - uses: actions/checkout@v4

      # 2. Install Node.js (for our code) and Java (the Firebase emulator needs it)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. Install the packages, exactly as listed in package-lock.json
      - name: Install server packages
        run: npm ci
        working-directory: ChopeLess/server
            - name: Install client packages
        working-directory: ChopeLess/client
        run: |
          rm -rf node_modules package-lock.json
          npm install --package-lock-only
          npm ci

      - name: Upload repaired client lock file
        uses: actions/upload-artifact@v4
        with:
          name: repaired-client-lock
          path: ChopeLess/client/package-lock.json
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
        working-directory: ChopeLess/client

      # 4. Unit tests (split bill), then the end-to-end tests in a real browser
      - name: Unit tests
        run: npm run test:unit
        working-directory: ChopeLess/client
      - name: End-to-end tests
        run: npm run test:e2e
        working-directory: ChopeLess/client

      # 5. If something failed, keep Playwright's results (page snapshots) so we can see what went wrong
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: ChopeLess/client/test-results
          retention-days: 7
