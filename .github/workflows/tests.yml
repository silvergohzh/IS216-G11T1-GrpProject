
# Runs automated tests for ChopeLess
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install server packages
        run: npm ci
        working-directory: ChopeLess/server

      # Temporary: regenerate the client lock file on Ubuntu
      - name: Install client packages
        working-directory: ChopeLess/client
        run: |
          rm -rf node_modules package-lock.json
          npm install --package-lock-only
          npm ci

      - name: Upload repaired client lock file
        uses: actions/upload-artifact@v4
        with:
          name: repaired-client-lock
          path: ChopeLess/client/package-lock.json

      - name: Install test browser
        run: npx playwright install --with-deps chromium
        working-directory: ChopeLess/client

      - name: Unit tests
        run: npm run test:unit
        working-directory: ChopeLess/client

      - name: End-to-end tests
        run: npm run test:e2e
        working-directory: ChopeLess/client

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: ChopeLess/client/test-results
          retention-days: 7
