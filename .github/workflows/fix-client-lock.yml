
name: Fix Client Lock File

on:
  workflow_dispatch:

jobs:
  fix-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: janani-myat-handover

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate client lock file
        working-directory: ChopeLess/client
        run: |
          rm -rf node_modules package-lock.json
          npm install --package-lock-only
          npm ci

      - name: Commit and push updated lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ChopeLess/client/package-lock.json
          if git diff --cached --quiet; then
            echo "No lock file changes"
          else
            git commit -m "Regenerate client lock file on Node 22"
            git push origin HEAD:janani-myat-handover
          fi
